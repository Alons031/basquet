<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Básquet: estadísticas</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2430;--mut:#6b7280;--line:#ddd6c6;--acc:#e8590c;--acc2:#1f4e79;--on:#fff;--hd:#0b2a4a;--row:#f7f3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1e242e;--ink:#eef0f3;--mut:#9aa3b0;--line:#323a47;--acc:#ff8a4c;--acc2:#6fb1ea;--on:#14181f;--hd:#0b2a4a;--row:#252c38}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:16px 16px 210px;max-width:900px;margin:0 auto}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:19px;margin:18px 0 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input{padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 4px;background:var(--card);border:2px solid var(--line);font-weight:700}
.tabs button.on{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row input{flex:1}
.primary{background:var(--acc);color:var(--on);padding:11px 16px;font-weight:700}
.ghost{background:transparent;border:2px solid var(--line);padding:8px 12px;color:var(--mut)}
.player{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.name{font-size:21px;font-weight:700}
.pts{font-size:32px;font-weight:800;color:var(--acc);line-height:1}
.pts small{font-size:12px;color:var(--mut);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.stat.shot{border-color:var(--acc2)}
.stat.col{border-color:var(--c);border-width:3px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.stat.col .btns button:not(.minus){background:var(--c);color:#111}
.stat b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.stat .n{font-size:26px;font-weight:800;margin:0 0 4px}
.btns{display:flex;gap:6px}
.btns button{flex:1;padding:9px 0;font-size:19px;font-weight:800;background:var(--acc2);color:var(--on)}
.btns button.minus{background:transparent;border:2px solid var(--line);color:var(--ink)}
.wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th{background:var(--hd);color:#fff;padding:10px 8px;text-align:right;font-weight:700}
td{padding:10px 8px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;font-weight:700}
td:first-child{background:var(--card)}
tr:nth-child(even) td{background:var(--row)}
tr.tot td{font-weight:800;border-top:2px solid var(--hd)}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.game{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.game button.open{background:var(--acc2);color:var(--on);padding:8px 14px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tb button{background:var(--card);border:2px solid var(--line);padding:10px 12px;font-weight:700}
.tb button.on{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.tb button:disabled{opacity:.4}
.bcourt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px}
.bcourt svg{display:block;width:100%;height:auto;max-height:calc(100vh - 190px);touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
input.bt{width:100%;font:800 22px "Trebuchet MS",system-ui,sans-serif;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:4px 2px;margin-bottom:6px}
#score{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:6px;width:92px;pointer-events:none}
#score .sb{background:var(--hd);color:#fff;border:2px solid #fff;border-radius:12px;padding:4px 10px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#score .sb small{display:block;font-size:10px;letter-spacing:.08em;font-weight:700;opacity:.9}
#score .sb b{display:block;font-size:22px;line-height:1.05;font-weight:800}
#score .ok{background:#15803d}#score .bad{background:#b91c1c}
#score .pts{padding:6px 10px;border-radius:14px}#score .pts b{font-size:34px}
#score .bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){#score .bump{animation:none}}
.bpl{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bpl .bn{flex:1;min-width:130px}.bpl .bn b{display:block;font-size:17px;overflow-wrap:anywhere}
.bpl .bn span{display:block;font-size:13px;opacity:.7;margin-top:2px}
.bpl button{padding:10px 12px;font-weight:700;border:2px solid var(--line);background:var(--card)}
.bpl button:disabled{opacity:.4}
h3.bh{margin:18px 2px 4px;font-size:18px}
.btrow{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.btrow h2{flex:1;margin:0;font:800 22px "Trebuchet MS",system-ui,sans-serif;overflow-wrap:anywhere}
.btrow button{padding:6px 12px;font-size:14px;font-weight:700;min-height:0;border:2px solid var(--line);background:var(--card)}
.btrow button.pri,.bpl button.pri{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.bname{border-color:var(--acc2)}
.bname input{flex:1 1 180px;min-width:0;font:700 17px "Trebuchet MS",system-ui,sans-serif;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:inherit}
.bname input.err{border-color:#e03131}
.gst{display:flex;gap:5px;flex-shrink:0}
.gst span{display:block;min-width:50px;text-align:center;border-radius:10px;padding:3px 4px;color:#fff;line-height:1.05;background:var(--hd)}
.gst span.ok{background:#15803d}.gst span.bad{background:#b91c1c}
.gst small{display:block;font-size:8px;letter-spacing:.04em;font-weight:700;opacity:.92}
.gst i{display:block;font-style:normal;font-size:19px;font-weight:800}
.game .gr{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-end;flex-shrink:0}.game>div:first-child{min-width:0}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin:18px 0 8px}
.ghead h2{margin:0;min-width:0;font-size:17px}
</style>
</head>
<body>
<h1>Básquet: estadísticas</h1>
<div class="tabs" id="tabs">
  <button data-tab="game">Partido</button>
  <button data-tab="avg">Promedios</button>
  <button data-tab="hist">Historial</button>
  <button data-tab="board">Tablero</button>
</div>
<div id="app"></div>
<div id="score" aria-live="polite"><div class="sb ok"><small>ACIERTOS</small><b>0</b></div><div class="sb bad"><small>ERRORES</small><b>0</b></div><div class="sb pts"><small>PUNTOS</small><b>0</b></div></div>

<script>
const C=[["m1","Tiro de 1 punto"],["m2","Tiro de 2 puntos"],["m3","Tiro de 3 puntos"],["def","Defensa"],["reb","Rebotes"],["ast","Asistencias"],["fal","Faltas"],["to","Se le fue alv"],["mal","Mal ahí"]];
const COL={def:"#22c55e",reb:"#14b8a6",ast:"#84cc16",to:"#f5b700",mal:"#f97316",fal:"#ef4444"};
const KEY="bball_v2";
let db={roster:[],games:[],cur:{rival:"",date:"",rows:{}}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)db=s}catch(e){}
let tab="game",open=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const zero=()=>Object.fromEntries(C.map(c=>[c[0],0]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function ask(msg,yes){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";o.innerHTML=`<div style="background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%"><p style="margin:0 0 14px;font-size:17px">${msg}</p><div class="row" style="margin:0"><button class="ghost" id="no">Cancelar</button><button class="primary" id="si" style="flex:1">Aceptar</button></div></div>`;document.body.appendChild(o);o.querySelector("#no").onclick=()=>o.remove();o.querySelector("#si").onclick=()=>{o.remove();yes()}}
const note=m=>ask(m,()=>{});
if(!db.cur.date)db.cur.date=today();
const row=id=>{const r=db.cur.rows[id]||(db.cur.rows[id]=zero());if(r.fal==null)r.fal=0;if(r.mal==null)r.mal=0;return r};
function d(s){return{pts:s.m1+2*s.m2+3*s.m3,m1:s.m1,m2:s.m2,m3:s.m3,def:s.def,reb:s.reb,ast:s.ast,fal:s.fal||0,to:s.to||0,mal:s.mal||0}}
const add=(a,b)=>{const r={};C.forEach(c=>r[c[0]]=(a[c[0]]||0)+(b[c[0]]||0));return r};

function table(list,avg,total){
  const H=["Jugador"].concat(avg?["PJ"]:[],["PTS","1 PT","2 PT","3 PT","DEF","REB","AST","FALTAS","SE LE FUE ALV","MAL AHÍ"]);
  const tr=(p,cls)=>{const x=d(p.t),g=avg?p.g:1,f=v=>avg?(v/g).toFixed(1):v;
   return `<tr class="${cls||""}"><td>${esc(p.name)}</td>${avg?`<td>${p.g}</td>`:""}`+
   [x.pts,x.m1,x.m2,x.m3,x.def,x.reb,x.ast,x.fal,x.to,x.mal].map(v=>`<td>${f(v)}</td>`).join("")+`</tr>`};
  let b=list.map(p=>tr(p)).join("");
  if(total&&list.length>1)b+=tr({name:"Equipo",t:list.reduce((a,p)=>add(a,p.t),zero())},"tot");
  return `<div class="wrap"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b}</tbody></table></div>`}

function vGame(){
  let h=`<div class="row"><input id="rival" placeholder="Rival (opcional)" value="${esc(db.cur.rival)}"><input id="date" type="date" value="${db.cur.date}"></div>
  <div class="row"><input id="nm" placeholder="Nombre del jugador nuevo" maxlength="30" autocomplete="off"><button class="primary" data-act="addp">Agregar jugador</button></div>`;
  if(!db.roster.length)return h+`<div class="empty">Agrega a tus jugadores. Se quedan guardados para todos los partidos.</div>`;
  h+=db.roster.map(p=>{const s=row(p.id);return `<div class="player"><div class="head"><div class="name">${esc(p.name)}</div><div class="pts">${d(s).pts}<small>puntos</small></div></div><div class="grid">`+
   C.map(c=>`<div class="stat ${/^[mx][123]$/.test(c[0])?"shot":COL[c[0]]?"col":""}" ${COL[c[0]]?`style="--c:${COL[c[0]]}"`:""}><b>${c[1]}</b><div class="n">${s[c[0]]||0}</div><div class="btns"><button class="minus" aria-label="Restar ${c[1]}" data-act="n" data-id="${p.id}" data-k="${c[0]}" data-d="-1">−</button><button aria-label="Sumar ${c[1]}" data-act="n" data-id="${p.id}" data-k="${c[0]}" data-d="1">+</button></div></div>`).join("")+
   `</div><div class="row" style="margin:10px 0 0"><button class="ghost" data-act="delp" data-id="${p.id}">Quitar jugador</button></div></div>`}).join("");
  return h+`<div class="row"><button class="primary" data-act="end" style="flex:1;padding:15px">Terminar partido y guardar</button></div>`}

function agg(){const m={};
  db.games.forEach(g=>g.rows.forEach(r=>{const o=m[r.id]||(m[r.id]={name:r.name,t:zero(),g:0});o.name=r.name;o.t=add(o.t,r.s);o.g++}));
  return Object.values(m).sort((a,b)=>d(b.t).pts/b.g-d(a.t).pts/a.g)}
function vAvg(){const l=agg();
  if(!l.length)return `<div class="empty">Aún no hay partidos guardados. Termina un partido para ver los promedios.</div>`;
  return `<h2>Promedio por partido (${db.games.length} partidos)</h2>`+table(l,true)+`<p class="mut">Promedio por partido de cada jugador.</p>
  <div class="row"><button class="ghost" data-act="exp">Descargar respaldo</button><button class="ghost" data-act="imp">Cargar respaldo</button><input id="file" type="file" accept=".json" hidden></div>`}
function vHist(){
  if(open){const g=db.games.find(x=>x.id===open);if(g)return `<div class="row"><button class="ghost" data-act="back">← Volver</button></div><div class="ghead"><h2>${g.rival?"vs "+esc(g.rival)+" · ":""}<span style="white-space:nowrap">${g.date}</span></h2>${gstats(g)}</div>`+
   table(g.rows.map(r=>({name:r.name,t:r.s})),false,true)+`<div class="row" style="margin-top:12px"><button class="ghost" data-act="delg" data-id="${g.id}">Borrar este partido</button></div>`;open=null}
  if(!db.games.length)return `<div class="empty">Todavía no hay partidos guardados.</div>`;
  return db.games.slice().reverse().map(g=>`<div class="game"><div><b>${g.rival?"vs "+esc(g.rival):"Partido"}</b><div class="mut">${g.date} · ${g.rows.length} jugadores</div></div><div class="gr">${gstats(g)}<button class="open" data-act="open" data-id="${g.id}">Ver</button></div></div>`).join("")}

function gstats(g){let ok=0,bad=0,pts=0;
  g.rows.forEach(r=>{const s=r.s;pts+=(s.m1||0)+2*(s.m2||0)+3*(s.m3||0);
    ok+=(s.m1||0)+(s.m2||0)+(s.m3||0)+(s.def||0)+(s.reb||0)+(s.ast||0);
    bad+=(s.fal||0)+(s.to||0)+(s.mal||0)});
  return `<div class="gst"><span class="ok"><small>ACIERTOS</small><i>${ok}</i></span><span class="bad"><small>ERRORES</small><i>${bad}</i></span><span><small>PUNTOS</small><i>${pts}</i></span></div>`}
function updScore(){
  let pts=0,ok=0,bad=0;
  db.roster.forEach(p=>{const s=db.cur.rows[p.id];if(!s)return;
    pts+=(s.m1||0)+2*(s.m2||0)+3*(s.m3||0);
    ok+=(s.m1||0)+(s.m2||0)+(s.m3||0)+(s.def||0)+(s.reb||0)+(s.ast||0);
    bad+=(s.fal||0)+(s.to||0)+(s.mal||0)});
  updScore.last=updScore.last||{};
  [["ok",ok],["bad",bad],["pts",pts]].forEach(([k,v])=>{
    const el=document.querySelector("#score ."+k);el.querySelector("b").textContent=v;
    if(updScore.last[k]!==undefined&&updScore.last[k]!==v){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}
    updScore.last[k]=v})}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.getElementById("app").innerHTML=tab==="game"?vGame():tab==="avg"?vAvg():tab==="board"?vBoard():vHist();if(tab==="board")bInit();updScore()}

document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;open=null;render()}};
document.addEventListener("input",e=>{if(e.target.id==="rival"){db.cur.rival=e.target.value;save()}if(e.target.id==="date"){db.cur.date=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nm")act("addp")});
document.addEventListener("change",e=>{if(e.target.id==="file"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(n.roster&&n.games){db=n;save();render();note("Respaldo cargado.")}}catch(x){note("El archivo no es válido.")}};r.readAsText(e.target.files[0])}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset)});
function act(a,s){
  if(a==="addp"){const i=document.getElementById("nm"),n=i.value.trim();if(!n)return;db.roster.push({id:"p"+Date.now(),name:n});save();render();document.getElementById("nm").focus()}
  else if(a==="n"){const r=row(s.id);r[s.k]=Math.max(0,(r[s.k]||0)+Number(s.d));save();render()}
  else if(a==="delp"){const p=db.roster.find(x=>x.id===s.id);ask("¿Quitar a "+esc(p.name)+"? Sus partidos guardados no se borran.",()=>{db.roster=db.roster.filter(x=>x.id!==s.id);delete db.cur.rows[s.id];save();render()})}
  else if(a==="end"){
    const rows=db.roster.map(p=>({id:p.id,name:p.name,s:row(p.id)})).filter(r=>Object.values(r.s).some(v=>v>0));
    if(!rows.length){note("Todavía no hay estadísticas que guardar.");return}
    ask("¿Terminar el partido y guardarlo?",()=>{const g={id:Date.now(),date:db.cur.date||today(),rival:db.cur.rival.trim(),rows};
    db.games.push(g);db.cur={rival:"",date:today(),rows:{}};save();open=g.id;tab="hist";render()})}
  else if(a==="open"){open=Number(s.id);render()}
  else if(a==="back"){open=null;render()}
  else if(a==="delg"){ask("¿Borrar este partido? Los promedios se recalculan.",()=>{db.games=db.games.filter(x=>x.id!==Number(s.id));open=null;save();render()})}
  else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="respaldo-basquet.json";l.click()}
  else if(a==="imp"){document.getElementById("file").click()}
}
/* ===== Tablero (cancha completa, horizontal) ===== */
const BK="bball_board2",BR=24;
function bNew(){return{p:{1:{x:600,y:265},2:{x:720,y:130},3:{x:720,y:400},4:{x:800,y:210},5:{x:800,y:320}},holder:1,bx:0,by:0,lines:[]}}
let bd={steps:[bNew()],cur:0,tool:"move",title:"Jugada nueva",logo:true,id:null},bdrag=null,bdraw=null,bplay=false;
try{const s=JSON.parse(localStorage.getItem(BK)||"null");if(s&&s.steps&&s.steps.length){bd.steps=s.steps;bd.title=s.title||"Jugada";bd.logo=s.logo!==false;bd.id=s.id||null}}catch(e){}

  <div class="tb"><button data-b="undo">Deshacer flecha</button><button data-b="clear">Borrar flechas</button><button data-b="logo" class="${bd.logo?"on":""}">Logo</button><span style="flex:1"></span><button data-b="reset">Reiniciar paso</button></div>
  <p class="mut">Gira el celular en horizontal para ver la cancha más grande. Mover: arrastra jugadores y balón. Movimiento, Botar, Pase y Bloqueo: dibuja con el dedo, desde un jugador o desde cualquier punto. Agrega un paso para la siguiente posición y toca Reproducir.</p>
  <h3 class="bh">Jugadas guardadas</h3><div id="bplays"></div>`}

const bDist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const bClamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const bBall=s=>s.holder?{x:s.p[s.holder].x-30,y:s.p[s.holder].y+24}:{x:s.bx,y:s.by};
function bToSvg(e){const s=document.getElementById("bsvg"),p=new DOMPoint(e.clientX,e.clientY).matrixTransform(s.getScreenCTM().inverse());return{x:p.x,y:p.y}}
function bQuad(q){
  if(q.length<3)return`M${q[0].x} ${q[0].y}L${q[q.length-1].x} ${q[q.length-1].y}`;
  let s=`M${q[0].x} ${q[0].y}`;
  for(let i=1;i<q.length-1;i++)s+=`Q${q[i].x} ${q[i].y} ${(q[i].x+q[i+1].x)/2} ${(q[i].y+q[i+1].y)/2}`;
  return s+`L${q[q.length-1].x} ${q[q.length-1].y}`}
function bSmooth(q){let a=q;for(let n=0;n<2;n++){const b=a;a=b.map((p,i)=>i===0||i===b.length-1?p:{x:(b[i-1].x+p.x+b[i+1].x)/3,y:(b[i-1].y+p.y+b[i+1].y)/3})}return a}
function bWavy(q){ // línea ondulada: onda perpendicular al trazo, se aplana al inicio y al final
  const P=[0];let L=0;for(let i=1;i<q.length;i++){L+=bDist(q[i-1],q[i]);P.push(L)}
  if(L<36)return q;
  const N=Math.floor(L/4),out=[];let j=0;
  for(let k=0;k<=N;k++){
    const s=k*L/N;while(j<P.length-2&&P[j+1]<s)j++;
    const a=q[j],b=q[j+1],t=(s-P[j])/((P[j+1]-P[j])||1);
    const tx=b.x-a.x,ty=b.y-a.y,tl=Math.hypot(tx,ty)||1;
    const o=8*Math.min(1,s/26,(L-s)/34)*Math.sin(s/3.4);
    out.push({x:a.x+tx*t-ty/tl*o,y:a.y+ty*t+tx/tl*o});
  }
  return out}
function bLine(l){
  const q=l.pts,a=q[0],z=q[q.length-1];
  if(l.type==="pass")return`<path d="M${a.x} ${a.y}L${z.x} ${z.y}" stroke="#161616" stroke-width="3.5" stroke-dasharray="12 9" fill="none" marker-end="url(#bah)"/>`;
  if(l.type==="screen"){
    const b=q[Math.max(0,q.length-6)],g=Math.atan2(z.y-b.y,z.x-b.x)+Math.PI/2,c=Math.cos(g)*20,s=Math.sin(g)*20;
    return`<path d="${bQuad(q)}" stroke="#161616" stroke-width="4.5" fill="none"/><path d="M${z.x-c} ${z.y-s}L${z.x+c} ${z.y+s}" stroke="#161616" stroke-width="6" stroke-linecap="round"/>`}
  if(l.type==="dribble"){
    const w=bWavy(bSmooth(q));
    return`<path d="M${w.map(p=>p.x.toFixed(1)+" "+p.y.toFixed(1)).join("L")}" stroke="#161616" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bah2)"/>`}
  return`<path d="${bQuad(q)}" stroke="#161616" stroke-width="4.5" fill="none" stroke-linecap="round" marker-end="url(#bah)"/>`}
function bRender(v,bxy){
  const el=document.getElementById("bdyn");if(!el)return;
  v=v||bd.steps[bd.cur];const b=bxy||bBall(v);
  let h=v.lines.map(bLine).join("");
  if(bdraw&&bdraw.pts.length>1)h+=bLine(bdraw);
  for(const id of [1,2,3,4,5]){const p=v.p[id];
    h+=`<circle cx="${p.x}" cy="${p.y}" r="${BR}" fill="#fff" stroke="#2f6fde" stroke-width="4.5"/><text x="${p.x}" y="${p.y+10}" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-weight="700" font-size="28" fill="#2f6fde">${id}</text>`}
  h+=`<circle cx="${b.x}" cy="${b.y}" r="14" fill="#e8781f" stroke="#161616" stroke-width="2"/><path d="M${b.x-14} ${b.y}H${b.x+14}M${b.x} ${b.y-14}V${b.y+14}" stroke="#161616" stroke-width="1.5"/>`;
  el.innerHTML=h}
function bSteps(){
  const el=document.getElementById("bsteps");if(!el)return;
  el.innerHTML=bd.steps.map((_,i)=>`<button data-s="${i}" class="${i===bd.cur?"on":""}">Paso ${i+1}</button>`).join("")+
   `<button data-b="add">Agregar paso</button><button data-b="del"${bd.steps.length<2?" disabled":""}>Quitar paso</button><span style="flex:1"></span><button data-b="play">Reproducir</button>`}
const bRefresh=()=>{bSteps();bRender()};

function bInit(){
  const svg=document.getElementById("bsvg");
  document.getElementById("btools").onclick=e=>{const t=e.target.closest("button");if(!t)return;bd.tool=t.dataset.t;document.querySelectorAll("#btools button").forEach(x=>x.classList.toggle("on",x===t))};
  svg.onpointerdown=e=>{
    if(bplay)return;
    const pt=bToSvg(e),s=bd.steps[bd.cur];svg.setPointerCapture(e.pointerId);
    if(bd.tool==="move"){
      const b=bBall(s);
      if(bDist(pt,b)<24){bdrag={k:"ball",dx:b.x-pt.x,dy:b.y-pt.y};s.holder=null;s.bx=b.x;s.by=b.y;return}
      for(const id of [5,4,3,2,1]){const p=s.p[id];if(bDist(pt,p)<BR+10){bdrag={k:"p",id,dx:p.x-pt.x,dy:p.y-pt.y};return}}
    }else{
      let st=pt;for(const id of [1,2,3,4,5]){if(bDist(pt,s.p[id])<BR+10){st={x:s.p[id].x,y:s.p[id].y};break}}
      bdraw={type:bd.tool,pts:[st]};
    }};
  svg.onpointermove=e=>{
    const pt=bToSvg(e),s=bd.steps[bd.cur];
    if(bdrag){
      const x=bClamp(pt.x+bdrag.dx,16,945),y=bClamp(pt.y+bdrag.dy,16,514);
      if(bdrag.k==="ball"){s.bx=x;s.by=y}else{s.p[bdrag.id]={x,y}}
      bRender();
    }else if(bdraw){
      const q=bdraw.pts;
      if(bdraw.type==="run"||bdraw.type==="dribble"){if(bDist(q[q.length-1],pt)>8)q.push(pt)}else{q[1]=pt}
      bRender();
    }};
  const end=()=>{
    const s=bd.steps[bd.cur];
    if(bdrag&&bdrag.k==="ball"){for(const id of [1,2,3,4,5]){if(bDist({x:s.bx,y:s.by},s.p[id])<50){s.holder=id;break}}}
    if(bdraw){const q=bdraw.pts;if(q.length>1&&bDist(q[0],q[q.length-1])>24)s.lines.push(bdraw);bdraw=null}
    bdrag=null;bSave();bRender()};
  svg.onpointerup=end;svg.onpointercancel=end;
  document.getElementById("app").onclick=e=>{
    const b=e.target.closest("button");if(!b||bplay)return;
    if(b.dataset.s!==undefined){bd.cur=+b.dataset.s;bRefresh();return}
    const a=b.dataset.b;if(!a)return;
    if(a==="logo"){bd.logo=!bd.logo;bSave();document.getElementById("bhawk").style.display=bd.logo?"":"none";b.classList.toggle("on",bd.logo);return}
    if(bPlayAct(a,b))return;
    if(a==="undo"){bd.steps[bd.cur].lines.pop()}
    else if(a==="clear"){bd.steps[bd.cur].lines=[]}
    else if(a==="reset"){bd.steps[bd.cur]=bNew()}
    else if(a==="add"){const n=JSON.parse(JSON.stringify(bd.steps[bd.cur]));n.lines=[];bd.steps.splice(bd.cur+1,0,n);bd.cur++}
    else if(a==="del"&&bd.steps.length>1){bd.steps.splice(bd.cur,1);bd.cur=Math.min(bd.cur,bd.steps.length-1)}
    else if(a==="play"){bPlay();return}
    bSave();bRefresh()};
  bRefresh();bList()}
function bLoadPlays(){try{return JSON.parse(localStorage.getItem("bball_plays")||"[]")}catch(e){return[]}}
function bStorePlays(L){try{localStorage.setItem("bball_plays",JSON.stringify(L))}catch(e){}}
let bSure=null;
let bNaming=false,bFlash=null;
function bList(){
  const el=document.getElementById("bplays");if(!el)return;
  const L=bLoadPlays();
  const form=bNaming?`<div class="bpl bname" id="bnameform"><div style="flex:1 1 100%"><b>Ponle nombre a la jugada</b></div><input id="bnm" maxlength="60" placeholder="Ej. Triángulo" value="${esc(bd.id?bd.title:"")}" aria-label="Nombre de la jugada"><button data-b="confirm" class="pri">Guardar</button>${bd.id?'<button data-b="confirmnew">Guardar como nueva</button>':''}<button data-b="cancel">Cancelar</button></div>`:"";
  const list=L.length?L.map(p=>`<div class="bpl"><div class="bn"><b>${esc(p.title)}</b><span>${p.steps.length} ${p.steps.length===1?"paso":"pasos"}${p.id===bd.id?" · en el tablero":""}${p.id===bFlash?" · ✓ Guardada":""}</span></div><button data-b="pplay" data-i="${p.id}"${p.steps.length<2?" disabled":""}>Reproducir</button><button data-b="popen" data-i="${p.id}">Abrir</button><button data-b="pdel" data-i="${p.id}">${bSure===p.id?"¿Seguro?":"Borrar"}</button></div>`).join(""):'<p style="opacity:.7">Todavía no hay jugadas guardadas. Arma una y toca Guardar arriba del tablero.</p>';
  el.innerHTML=form+list;
  const inp=document.getElementById("bnm");
  if(inp)inp.onkeydown=e=>{if(e.key==="Enter"){const c=document.querySelector('[data-b="confirm"]');if(c)c.click()}}}
function bDoSave(name,asNew){
  const rec={id:(asNew?null:bd.id)||"p"+Date.now(),title:name,steps:JSON.parse(JSON.stringify(bd.steps)),t:Date.now()};
  const L=bLoadPlays(),i=L.findIndex(x=>x.id===rec.id);
  if(i>=0)L[i]=rec;else L.unshift(rec);
  bd.id=rec.id;bd.title=name;bStorePlays(L);bSave();
  const t=document.getElementById("bt");if(t)t.textContent=name;
  bNaming=false;bFlash=rec.id;bList();
  setTimeout(()=>{if(bFlash===rec.id){bFlash=null;if(!bNaming)bList()}},2200)}
function bPlayAct(a,b){
  if(a==="save"){
    bNaming=true;bList();
    const f=document.getElementById("bnameform");if(f)f.scrollIntoView({behavior:"smooth",block:"center"});
    const i=document.getElementById("bnm");if(i){i.focus({preventScroll:true});i.select()}
    return true}
  if(a==="cancel"){bNaming=false;bList();return true}
  if(a==="confirm"||a==="confirmnew"){
    const i=document.getElementById("bnm"),v=i?i.value.trim():"";
    if(!v){if(i){i.classList.add("err");i.placeholder="Escribe un nombre";i.focus()}return true}
    bDoSave(v,a==="confirmnew");return true}
  if(a==="new"){bd.steps=[bNew()];bd.cur=0;bd.id=null;bd.title="Jugada nueva";bNaming=false;bSave();render();return true}
  const id=b.dataset.i;
  if(a==="popen"||a==="pplay"){
    const p=bLoadPlays().find(x=>x.id===id);if(!p)return true;
    bd.steps=JSON.parse(JSON.stringify(p.steps));bd.cur=0;bd.id=p.id;bd.title=p.title;bSave();render();
    const s=document.getElementById("bsvg");if(s)s.scrollIntoView({block:"center"});
    if(a==="pplay")bPlay();return true}
  if(a==="pdel"){
    if(bSure!==id){bSure=id;bList();setTimeout(()=>{if(bSure===id){bSure=null;bList()}},3000);return true}
    bStorePlays(bLoadPlays().filter(x=>x.id!==id));if(bd.id===id)bd.id=null;bSure=null;bSave();bList();return true}
  return false}
async function bPlay(){
  if(bd.steps.length<2)return;
  bplay=true;
  for(let i=0;i<bd.steps.length-1;i++){
    const A=bd.steps[i],B=bd.steps[i+1],ba=bBall(A),bb=bBall(B);
    await new Promise(res=>{const t0=performance.now();
      (function f(t){const k=bClamp((t-t0)/1000,0,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,p={};
        for(const id of [1,2,3,4,5])p[id]={x:A.p[id].x+(B.p[id].x-A.p[id].x)*e,y:A.p[id].y+(B.p[id].y-A.p[id].y)*e};
        bRender({p,lines:A.lines},{x:ba.x+(bb.x-ba.x)*e,y:ba.y+(bb.y-ba.y)*e});
        k<1?requestAnimationFrame(f):res()})(t0)});
  }
  bplay=false;bd.cur=bd.steps.length-1;if(tab==="board")bRefresh()}
/* ===== fin Tablero ===== */
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
