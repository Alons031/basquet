<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Básquet: estadísticas</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2430;--mut:#6b7280;--line:#ddd6c6;--acc:#e8590c;--acc2:#1f4e79;--on:#fff;--hd:#0b2a4a;--row:#f7f3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1e242e;--ink:#eef0f3;--mut:#9aa3b0;--line:#323a47;--acc:#ff8a4c;--acc2:#6fb1ea;--on:#14181f;--hd:#0b2a4a;--row:#252c38}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:19px;margin:18px 0 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input{padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 4px;background:var(--card);border:2px solid var(--line);font-weight:700}
.tabs button.on{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row input{flex:1}
.primary{background:var(--acc);color:var(--on);padding:11px 16px;font-weight:700}
.ghost{background:transparent;border:2px solid var(--line);padding:8px 12px;color:var(--mut)}
.player{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.name{font-size:21px;font-weight:700}
.pts{font-size:32px;font-weight:800;color:var(--acc);line-height:1}
.pts small{font-size:12px;color:var(--mut);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.stat.shot{border-color:var(--acc)}
.stat.col{border-color:var(--c);border-width:3px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.stat.col .btns button:not(.minus){background:var(--c);color:#111}
.stat b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.stat .n{font-size:26px;font-weight:800;margin:0 0 4px}
.btns{display:flex;gap:6px}
.btns button{flex:1;padding:9px 0;font-size:19px;font-weight:800;background:var(--acc2);color:var(--on)}
.btns button.minus{background:transparent;border:2px solid var(--line);color:var(--ink)}
.wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th{background:var(--hd);color:#fff;padding:10px 8px;text-align:right;font-weight:700}
td{padding:10px 8px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;font-weight:700}
td:first-child{background:var(--card)}
tr:nth-child(even) td{background:var(--row)}
tr.tot td{font-weight:800;border-top:2px solid var(--hd)}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.game{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.game button.open{background:var(--acc2);color:var(--on);padding:8px 14px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
</style>
</head>
<body>
<h1>Básquet: estadísticas</h1>
<div class="tabs" id="tabs">
  <button data-tab="game">Partido</button>
  <button data-tab="avg">Promedios</button>
  <button data-tab="hist">Historial</button>
</div>
<div id="app"></div>

<script>
const C=[["m1","Tiro de 1 punto"],["m2","Tiro de 2 puntos"],["m3","Tiro de 3 puntos"],["def","Defensa"],["reb","Rebotes"],["ast","Asistencias"],["fal","Faltas"],["to","Se le fue alv"]];
const COL={def:"#22c55e",reb:"#f5b700",ast:"#3b82f6",fal:"#ef4444",to:"#a855f7"};
const KEY="bball_v2";
let db={roster:[],games:[],cur:{rival:"",date:"",rows:{}}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)db=s}catch(e){}
let tab="game",open=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const zero=()=>Object.fromEntries(C.map(c=>[c[0],0]));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function ask(msg,yes){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";o.innerHTML=`<div style="background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%"><p style="margin:0 0 14px;font-size:17px">${msg}</p><div class="row" style="margin:0"><button class="ghost" id="no">Cancelar</button><button class="primary" id="si" style="flex:1">Aceptar</button></div></div>`;document.body.appendChild(o);o.querySelector("#no").onclick=()=>o.remove();o.querySelector("#si").onclick=()=>{o.remove();yes()}}
const note=m=>ask(m,()=>{});
if(!db.cur.date)db.cur.date=today();
const row=id=>{const r=db.cur.rows[id]||(db.cur.rows[id]=zero());if(r.fal==null)r.fal=0;return r};
function d(s){return{pts:s.m1+2*s.m2+3*s.m3,m1:s.m1,m2:s.m2,m3:s.m3,def:s.def,reb:s.reb,ast:s.ast,fal:s.fal||0,to:s.to}}
const add=(a,b)=>{const r={};C.forEach(c=>r[c[0]]=(a[c[0]]||0)+(b[c[0]]||0));return r};

function table(list,avg,total){
  const H=["Jugador"].concat(avg?["PJ"]:[],["PTS","1 PT","2 PT","3 PT","DEF","REB","AST","FALTAS","SE LE FUE ALV"]);
  const tr=(p,cls)=>{const x=d(p.t),g=avg?p.g:1,f=v=>avg?(v/g).toFixed(1):v;
   return `<tr class="${cls||""}"><td>${esc(p.name)}</td>${avg?`<td>${p.g}</td>`:""}`+
   [x.pts,x.m1,x.m2,x.m3,x.def,x.reb,x.ast,x.fal,x.to].map(v=>`<td>${f(v)}</td>`).join("")+`</tr>`};
  let b=list.map(p=>tr(p)).join("");
  if(total&&list.length>1)b+=tr({name:"Equipo",t:list.reduce((a,p)=>add(a,p.t),zero())},"tot");
  return `<div class="wrap"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b}</tbody></table></div>`}

function vGame(){
  let h=`<div class="row"><input id="rival" placeholder="Rival (opcional)" value="${esc(db.cur.rival)}"><input id="date" type="date" value="${db.cur.date}"></div>
  <div class="row"><input id="nm" placeholder="Nombre del jugador nuevo" maxlength="30" autocomplete="off"><button class="primary" data-act="addp">Agregar jugador</button></div>`;
  if(!db.roster.length)return h+`<div class="empty">Agrega a tus jugadores. Se quedan guardados para todos los partidos.</div>`;
  h+=db.roster.map(p=>{const s=row(p.id);return `<div class="player"><div class="head"><div class="name">${esc(p.name)}</div><div class="pts">${d(s).pts}<small>puntos</small></div></div><div class="grid">`+
   C.map(c=>`<div class="stat ${/^[mx][123]$/.test(c[0])?"shot":COL[c[0]]?"col":""}" ${COL[c[0]]?`style="--c:${COL[c[0]]}"`:""}><b>${c[1]}</b><div class="n">${s[c[0]]||0}</div><div class="btns"><button class="minus" aria-label="Restar ${c[1]}" data-act="n" data-id="${p.id}" data-k="${c[0]}" data-d="-1">−</button><button aria-label="Sumar ${c[1]}" data-act="n" data-id="${p.id}" data-k="${c[0]}" data-d="1">+</button></div></div>`).join("")+
   `</div><div class="row" style="margin:10px 0 0"><button class="ghost" data-act="delp" data-id="${p.id}">Quitar jugador</button></div></div>`}).join("");
  return h+`<div class="row"><button class="primary" data-act="end" style="flex:1;padding:15px">Terminar partido y guardar</button></div>`}

function agg(){const m={};
  db.games.forEach(g=>g.rows.forEach(r=>{const o=m[r.id]||(m[r.id]={name:r.name,t:zero(),g:0});o.name=r.name;o.t=add(o.t,r.s);o.g++}));
  return Object.values(m).sort((a,b)=>d(b.t).pts/b.g-d(a.t).pts/a.g)}
function vAvg(){const l=agg();
  if(!l.length)return `<div class="empty">Aún no hay partidos guardados. Termina un partido para ver los promedios.</div>`;
  return `<h2>Promedio por partido (${db.games.length} partidos)</h2>`+table(l,true)+`<p class="mut">Promedio por partido de cada jugador.</p>
  <div class="row"><button class="ghost" data-act="exp">Descargar respaldo</button><button class="ghost" data-act="imp">Cargar respaldo</button><input id="file" type="file" accept=".json" hidden></div>`}
function vHist(){
  if(open){const g=db.games.find(x=>x.id===open);if(g)return `<div class="row"><button class="ghost" data-act="back">← Volver</button></div><h2>${g.rival?"vs "+esc(g.rival)+" · ":""}${g.date}</h2>`+
   table(g.rows.map(r=>({name:r.name,t:r.s})),false,true)+`<div class="row" style="margin-top:12px"><button class="ghost" data-act="delg" data-id="${g.id}">Borrar este partido</button></div>`;open=null}
  if(!db.games.length)return `<div class="empty">Todavía no hay partidos guardados.</div>`;
  return db.games.slice().reverse().map(g=>`<div class="game"><div><b>${g.rival?"vs "+esc(g.rival):"Partido"}</b><div class="mut">${g.date} · ${g.rows.length} jugadores</div></div><button class="open" data-act="open" data-id="${g.id}">Ver</button></div>`).join("")}

function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  document.getElementById("app").innerHTML=tab==="game"?vGame():tab==="avg"?vAvg():vHist()}

document.getElementById("tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.tab;open=null;render()}};
document.addEventListener("input",e=>{if(e.target.id==="rival"){db.cur.rival=e.target.value;save()}if(e.target.id==="date"){db.cur.date=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="nm")act("addp")});
document.addEventListener("change",e=>{if(e.target.id==="file"&&e.target.files[0]){const r=new FileReader();r.onload=()=>{try{const n=JSON.parse(r.result);if(n.roster&&n.games){db=n;save();render();note("Respaldo cargado.")}}catch(x){note("El archivo no es válido.")}};r.readAsText(e.target.files[0])}});
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)act(b.dataset.act,b.dataset)});
function act(a,s){
  if(a==="addp"){const i=document.getElementById("nm"),n=i.value.trim();if(!n)return;db.roster.push({id:"p"+Date.now(),name:n});save();render();document.getElementById("nm").focus()}
  else if(a==="n"){const r=row(s.id);r[s.k]=Math.max(0,(r[s.k]||0)+Number(s.d));save();render()}
  else if(a==="delp"){const p=db.roster.find(x=>x.id===s.id);ask("¿Quitar a "+esc(p.name)+"? Sus partidos guardados no se borran.",()=>{db.roster=db.roster.filter(x=>x.id!==s.id);delete db.cur.rows[s.id];save();render()})}
  else if(a==="end"){
    const rows=db.roster.map(p=>({id:p.id,name:p.name,s:row(p.id)})).filter(r=>Object.values(r.s).some(v=>v>0));
    if(!rows.length){note("Todavía no hay estadísticas que guardar.");return}
    ask("¿Terminar el partido y guardarlo?",()=>{const g={id:Date.now(),date:db.cur.date||today(),rival:db.cur.rival.trim(),rows};
    db.games.push(g);db.cur={rival:"",date:today(),rows:{}};save();open=g.id;tab="hist";render()})}
  else if(a==="open"){open=Number(s.id);render()}
  else if(a==="back"){open=null;render()}
  else if(a==="delg"){ask("¿Borrar este partido? Los promedios se recalculan.",()=>{db.games=db.games.filter(x=>x.id!==Number(s.id));open=null;save();render()})}
  else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="respaldo-basquet.json";l.click()}
  else if(a==="imp"){document.getElementById("file").click()}
}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
