<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Básquet: estadísticas</title>
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2430;--mut:#6b7280;--line:#ddd6c6;--acc:#e8590c;--acc2:#1f4e79;--on:#fff;--hd:#0b2a4a;--row:#f7f3ea;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14181f;--card:#1e242e;--ink:#eef0f3;--mut:#9aa3b0;--line:#323a47;--acc:#ff8a4c;--acc2:#6fb1ea;--on:#14181f;--hd:#0b2a4a;--row:#252c38}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:16px 16px 210px;max-width:900px;margin:0 auto}
h1{font-size:24px;margin:4px 0 12px}
h2{font-size:19px;margin:18px 0 8px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
input{padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px 4px;background:var(--card);border:2px solid var(--line);font-weight:700}
.tabs button.on{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.row input{flex:1}
.primary{background:var(--acc);color:var(--on);padding:11px 16px;font-weight:700}
.ghost{background:transparent;border:2px solid var(--line);padding:8px 12px;color:var(--mut)}
.player{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.name{font-size:21px;font-weight:700}
.pts{font-size:32px;font-weight:800;color:var(--acc);line-height:1}
.pts small{font-size:12px;color:var(--mut);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.stat.shot{border-color:var(--acc2)}
.stat.col{border-color:var(--c);border-width:3px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.stat.col .btns button:not(.minus){background:var(--c);color:#111}
.stat b{display:block;font-size:12px;color:var(--mut);font-weight:600}
.stat .n{font-size:26px;font-weight:800;margin:0 0 4px}
.btns{display:flex;gap:6px}
.btns button{flex:1;padding:9px 0;font-size:19px;font-weight:800;background:var(--acc2);color:var(--on)}
.btns button.minus{background:transparent;border:2px solid var(--line);color:var(--ink)}
.wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th{background:var(--hd);color:#fff;padding:10px 8px;text-align:right;font-weight:700}
td{padding:10px 8px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:inherit;font-weight:700}
td:first-child{background:var(--card)}
tr:nth-child(even) td{background:var(--row)}
tr.tot td{font-weight:800;border-top:2px solid var(--hd)}
.empty{color:var(--mut);text-align:center;padding:26px 10px}
.game{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.game button.open{background:var(--acc2);color:var(--on);padding:8px 14px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tb button{background:var(--card);border:2px solid var(--line);padding:10px 12px;font-weight:700}
.tb button.on{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.tb button:disabled{opacity:.4}
.bcourt{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px}
.bcourt svg{display:block;width:100%;height:auto;max-height:calc(100vh - 190px);touch-action:none;user-select:none;-webkit-user-select:none;border-radius:6px}
input.bt{width:100%;font:800 22px "Trebuchet MS",system-ui,sans-serif;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:4px 2px;margin-bottom:6px}
#score{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;flex-direction:column;gap:6px;width:92px;pointer-events:none}
#score .sb{background:var(--hd);color:#fff;border:2px solid #fff;border-radius:12px;padding:4px 10px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#score .sb small{display:block;font-size:10px;letter-spacing:.08em;font-weight:700;opacity:.9}
#score .sb b{display:block;font-size:22px;line-height:1.05;font-weight:800}
#score .ok{background:#15803d}#score .bad{background:#b91c1c}
#score .sb{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
#score .sb.pts{pointer-events:none;cursor:default}
#score .ae{background:linear-gradient(90deg,#15803d 50%,#b91c1c 50%)}
#score .ae b{font-size:24px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
#score .ok,#score .bad{display:none}
#score.open .ok,#score.open .bad{display:block}
#score.open .ae{display:none}
#score .sb:focus-visible{outline:3px solid #fff;outline-offset:2px}
#score .pts{padding:6px 10px;border-radius:14px}#score .pts b{font-size:34px}
#score .bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){#score .bump{animation:none}}
.bpl{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bpl .bn{flex:1;min-width:130px}.bpl .bn b{display:block;font-size:17px;overflow-wrap:anywhere}
.bpl .bn span{display:block;font-size:13px;opacity:.7;margin-top:2px}
.bpl button{padding:10px 12px;font-weight:700;border:2px solid var(--line);background:var(--card)}
.bpl button:disabled{opacity:.4}
h3.bh{margin:18px 2px 4px;font-size:18px}
.btrow{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
.btrow h2{flex:1;margin:0;font:800 22px "Trebuchet MS",system-ui,sans-serif;overflow-wrap:anywhere}
.btrow button{padding:6px 12px;font-size:14px;font-weight:700;min-height:0;border:2px solid var(--line);background:var(--card)}
.btrow button.pri,.bpl button.pri{background:var(--acc2);color:var(--on);border-color:var(--acc2)}
.bname{border-color:var(--acc2)}
.bname input{flex:1 1 180px;min-width:0;font:700 17px "Trebuchet MS",system-ui,sans-serif;padding:10px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:inherit}
.bname input.err{border-color:#e03131}
.gst{display:flex;gap:5px;flex-shrink:0}
.gst span{display:block;min-width:50px;text-align:center;border-radius:10px;padding:3px 4px;color:#fff;line-height:1.05;background:var(--hd)}
.gst span.ok{background:#15803d}.gst span.bad{background:#b91c1c}
.gst small{display:block;font-size:8px;letter-spacing:.04em;font-weight:700;opacity:.92}
.gst i{display:block;font-style:normal;font-size:19px;font-weight:800}
.game .gr{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;justify-content:flex-end;flex-shrink:0}.game>div:first-child{min-width:0}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin:18px 0 8px}
.ghead h2{margin:0;min-width:0;font-size:17px}
.strip{position:relative;display:flex;flex-wrap:wrap;gap:10px;margin:2px 0 6px}
.tile{width:68px;height:68px;border-radius:16px;background:#fff;color:#111;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab;box-shadow:0 2px 6px rgba(0,0,0,.25);text-align:center;overflow:hidden}
.tile b{font-size:28px;line-height:1;font-weight:800;color:#111}
.tile span{font-size:11px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555;margin-top:2px}
.tile.ghost{opacity:.25}
.tile.drag{position:fixed;z-index:120;margin:0;pointer-events:none;transform:scale(1.12) rotate(-3deg);box-shadow:0 12px 28px rgba(0,0,0,.45);border-color:var(--acc2);cursor:grabbing}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .name{overflow-wrap:anywhere}
.numb{background:#fff;color:#111;border:3px solid var(--line);border-radius:12px;min-width:46px;height:46px;font-size:22px;font-weight:800;padding:0 6px;flex-shrink:0}
.player.flash{animation:fl 1s}
@keyframes fl{0%,100%{box-shadow:none}30%{box-shadow:0 0 0 4px var(--acc2)}}
.sheet{background:var(--card);border:2px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{margin:6px 0 12px;font-size:19px;text-align:center}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 6px}
.numbox{display:block;margin:0 auto 6px;width:104px;height:104px;text-align:center;font:800 54px "Trebuchet MS",system-ui,sans-serif;background:#fff;color:#111;border:3px solid var(--acc2);border-radius:20px;padding:0}
.nerr{min-height:20px;text-align:center;color:#ef4444;font-size:14px;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.sheet,.player.flash{animation:none}}
.player .head{margin-bottom:0;gap:10px;justify-content:flex-start}
.player{transition:border-color .3s,box-shadow .3s}
.player.open{border-color:var(--acc2);box-shadow:0 6px 22px rgba(0,0,0,.28)}
.hit{flex:1;min-width:0;display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0;-webkit-tap-highlight-color:transparent;border-radius:10px}
.hit:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.hit .name{flex:1;min-width:0;overflow-wrap:anywhere}
.chev{width:12px;height:12px;border-right:4px solid var(--mut);border-bottom:4px solid var(--mut);transform:rotate(45deg) translate(-2px,-2px);transition:transform .4s cubic-bezier(.34,1.56,.64,1),border-color .3s;flex-shrink:0;margin:0 4px 0 2px}
.player.open .chev{transform:rotate(225deg) translate(-2px,-2px);border-color:var(--acc2)}
.pbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s cubic-bezier(.22,1,.36,1)}
.player.open .pbody{grid-template-rows:1fr}
.pin{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s .42s}
.player.open .pin{visibility:visible;transition-delay:0s}
.pin2{padding-top:10px}
.player .stat{opacity:0;transform:translateY(14px) scale(.9);transition:opacity .18s,transform .18s}
.player.open .stat{opacity:1;transform:none;transition:opacity .3s ease-out calc(var(--i)*40ms + 90ms),transform .45s cubic-bezier(.34,1.56,.64,1) calc(var(--i)*40ms + 90ms)}
@media (prefers-reduced-motion:reduce){.pbody,.pin,.chev,.player,.player .stat,.player.open .stat{transition:none}}

/* marcador por cuartos */
.qb{background:#262a31;color:#fff;border-radius:12px;padding:8px 6px;margin:0 auto 12px;max-width:460px;display:grid;grid-template-columns:repeat(5,1fr);row-gap:2px;text-align:center}
.qb span{font-size:14px;color:#9aa3b0;font-weight:600}
.qb span.cur{color:#ff8a4c;font-weight:800}
.qb b{font-size:21px;font-weight:700;line-height:1.35}
.qb b.nil{color:#9aa3b0;font-weight:600}
.qb b.cur{color:#ff8a4c}
.qb b.t{font-weight:800}
.qb b.pop{animation:qpop .6s ease-out}
@keyframes qpop{0%{transform:scale(1.7);opacity:.2}60%{transform:scale(.94)}100%{transform:none;opacity:1}}
.qend{background:var(--acc2);color:var(--on);padding:13px;font-weight:700}
.qend:disabled{opacity:.45;cursor:default}
/* caja izquierda: tiempos fuera y faltas */
#lt{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;width:134px;pointer-events:none}
#lt[hidden]{display:none}
#lt .lbx{background:var(--hd);color:#fff;border:2px solid #fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#lt .lsec{padding:6px 8px}
#lt .lsec+.lsec{border-top:1px solid rgba(255,255,255,.22)}
#lt small{display:block;font-size:10px;letter-spacing:.08em;font-weight:700;opacity:.9;text-align:center}
#lt em{display:block;font-style:normal;font-size:10px;opacity:.78;text-align:center}
#lt .tks{display:flex;justify-content:center;gap:6px;margin:4px 0 3px}
#lt .tk{pointer-events:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
#lt .tk.on{background:#f5b700;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.45);cursor:grab}
#lt .tk.on.grab{cursor:grabbing;position:relative;z-index:5;box-shadow:0 8px 16px rgba(0,0,0,.5);animation:none!important}
#lt .tk.on.go{background:#ef4444;color:#fff}
#lt .tk.off{border:2px dashed rgba(255,255,255,.55);cursor:pointer}
#lt .low .tk.on{animation:lowp 1s ease-in-out infinite}
#lt .fl{display:flex;justify-content:space-between;align-items:center;gap:6px;border-radius:0 0 10px 10px}
#lt .fl small{text-align:left}
#lt .fl b{font-size:24px;line-height:1;font-weight:800}
#lt .fl.hot{background:rgba(239,68,68,.32)}
#lt .fl.hot b{color:#ff9a9a;animation:lowp 1s ease-in-out infinite}
#lt .bump{animation:bump .35s}
@keyframes lowp{50%{transform:scale(1.14)}}
/* avisos */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:120;width:min(92vw,420px);pointer-events:none}
.tz{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;color:#fff;font-weight:800;font-size:17px;line-height:1.2;box-shadow:0 10px 28px rgba(0,0,0,.45);border:2px solid #fff;animation:tzin .45s cubic-bezier(.2,1.3,.4,1) both,tzout .35s ease-in 3.7s forwards}
.tz small{display:block;font-weight:600;font-size:13px;margin-top:2px}
.tz.warn{background:#b45309}.tz.bonus{background:#b91c1c;animation:tzin .45s cubic-bezier(.2,1.3,.4,1) both,tzshake .5s .45s,tzout .35s ease-in 3.7s forwards}.tz.info{background:#1f4e79}
.tz i{flex:none;width:32px;height:32px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:18px}
.tz.warn i{color:#b45309}.tz.info i{color:#1f4e79}
.tz i.ball{background:none;font-size:30px;width:auto;animation:tzball .45s ease-in-out infinite alternate}
@keyframes tzin{from{transform:translateY(-150%) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes tzout{to{transform:translateY(-150%);opacity:0}}
@keyframes tzshake{0%,100%{transform:none}20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(8px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes tzball{from{transform:translateY(0)}to{transform:translateY(-8px) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){#lt .bump,#lt .low .tk.on,#lt .fl.hot b,.qb b.pop,.tz i.ball{animation:none}.tz,.tz.bonus{animation:none!important}}

/* jugando / banca */
.onb{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;padding:0;border:3px solid var(--line);background:var(--card);transition:background .25s,border-color .25s,transform .12s;-webkit-tap-highlight-color:transparent}
.onb:active{transform:scale(.9)}
.onb.on{background:color-mix(in srgb,var(--acc) 18%,var(--card));border-color:var(--acc);--rc:var(--acc)}
.onb.off{background:var(--row);border:3px dashed var(--mut);color:var(--mut);--rc:var(--mut)}
.onb svg{display:block;width:28px;height:28px}
.onb.anim{animation:bnRing .6s ease-out}
.onb.on.anim svg{animation:bnBall .65s ease-out}
.onb.off.anim svg{animation:bnSit .55s ease-out}
@keyframes bnRing{from{box-shadow:0 0 0 0 var(--rc)}to{box-shadow:0 0 0 14px transparent}}
@keyframes bnBall{0%{transform:translateY(-16px) scale(.7) rotate(-220deg);opacity:0}45%{transform:translateY(0) scale(1.18,.82) rotate(0)}68%{transform:translateY(-7px) scale(.96,1.04)}100%{transform:none;opacity:1}}
@keyframes bnSit{0%{transform:translateY(-20px);opacity:0}55%{transform:translateY(2px) scaleY(.86)}78%{transform:translateY(-2px)}100%{transform:none;opacity:1}}
.tile{position:relative}
.tile.bn{background:#e4e0d4;border-style:dashed;border-color:var(--mut)}
.tile .tbi{position:absolute;top:1px;right:2px;width:18px;height:18px;pointer-events:none;color:#4b5563}
.tile .tbi svg{display:block;width:18px;height:18px}
@media (prefers-reduced-motion:reduce){.onb,.onb.anim,.onb.anim svg{animation:none;transition:none}}
.player,.qb{scroll-margin-top:10px}
#app,body{overflow-anchor:none}
.tabs{gap:3px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;font-size:12.5px;padding:11px 4px;white-space:nowrap}
@media (max-width:380px){.tabs button{font-size:11.5px;padding:11px 3px}}
.player{position:relative}
.hit .name{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.posb{margin-left:0;min-width:34px;height:34px;border-radius:50%;border:2px solid var(--acc2);background:var(--acc2);color:var(--on);font-weight:800;font-size:17px;padding:0 6px;vertical-align:middle;line-height:1;perspective:200px;transition:transform .2s}
.posb:active{transform:scale(.88)}
.posb.empty{background:transparent;border-style:dashed;color:var(--mut);font-size:10px;letter-spacing:.04em;border-radius:17px;min-width:40px}
.posbar{position:absolute;left:10px;right:10px;top:66px;z-index:40;display:flex;gap:6px;background:var(--card);border:2px solid var(--acc2);border-radius:16px;padding:8px;box-shadow:0 12px 28px rgba(0,0,0,.45);visibility:hidden;opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top left;transition:opacity .2s,transform .28s cubic-bezier(.34,1.56,.64,1),visibility 0s .28s}
.posbar.show{visibility:visible;opacity:1;transform:none;transition-delay:0s}
.po{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:2px solid var(--line);background:transparent;color:inherit;border-radius:12px}
.po b{font-size:22px;line-height:1}
.po small{font-size:9px;color:var(--mut);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.po.on{background:var(--acc2);border-color:var(--acc2);color:var(--on)}
.po.on small{color:inherit}
.posbar.show .po{animation:popIn .42s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes popIn{from{opacity:0;transform:translateY(12px) scale(.5)}to{opacity:1;transform:none}}
textarea{width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;line-height:1.4;resize:vertical;min-height:130px}
textarea.err{border-color:#ef4444}
.nbox{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.nh{margin:0 0 8px;font-size:18px}
.nlh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 8px}.nlh .nh{margin:0}
.note{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px;animation:popIn .35s ease-out both}
.note.editing{border-color:var(--acc2)}
.nmeta{font-size:13px;color:var(--mut)}
.ntxt{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 10px;font-size:16px;line-height:1.45}
.note .row{margin:0;flex-wrap:wrap}
.nlh .wa{white-space:nowrap;padding:8px 12px}
.wa{background:#25d366;color:#0b2e13;font-weight:800;padding:10px 14px;border-radius:10px;border:0}
.note .ghost{padding:10px 12px}
@media (prefers-reduced-motion:reduce){.posbar,.posbar.show .po,.note{transition:none;animation:none}}

/* guardar notas en el dispositivo */

<body>

      <rect x="28" y="2" width="104" height="66" rx="7" fill="rgba(255,255,255,.93)" stroke="#cdd5df" stroke-width="3"/>
      <rect x="62" y="30" width="36" height="26" rx="2" fill="none" stroke="#e8590c" stroke-width="3"/>

    </svg>
    <svg id="spBall" viewBox="0 0 100 100" aria-hidden="true">
      <defs><radialGradient id="spbg" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#ffb868"/><stop offset=".55" stop-color="#f08a24"/><stop offset="1" stop-color="#d4621a"/></radialGradient></defs>
      <circle cx="50" cy="50" r="46" fill="url(#spbg)" stroke="#5a2a05" stroke-width="4"/>
      <path d="M50 4v92M4 50h92" stroke="#5a2a05" stroke-width="4" fill="none"/>

    </svg>

      <g id="spNet" stroke="rgba(255,255,255,.9)" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M46 88L62 128M56 90L68 128M68 91L74 128M80 91V128M92 91L86 128M104 90L92 128M114 88L98 128"/>
        <path d="M52 108Q80 116 108 108M58 119Q80 125 102 119M48 97Q80 104 112 97"/>
      </g>

    </svg>

    <div class="sp-txt"><div class="sp-hi" id="spHi"></div><div class="sp-nm" id="spName"></div><div class="sp-ms" id="spMsg">¡Que te lo pases bien!</div></div>

<script>
(function(){
  var stage=document.getElementById("splash"),ball=document.getElementById("spBall"),
      hb=document.getElementById("spHb"),hf=document.getElementById("spHf"),
      net=document.getElementById("spNet"),flash=document.getElementById("spFlash"),rays=document.getElementById("spRays"),
      hi=document.getElementById("spHi"),nm=document.getElementById("spName"),ms=document.getElementById("spMsg"),tp=document.getElementById("spHint"),
      mode="real",raf=0,timers=[],extra=[];
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;

  var st=document.getElementById("spStars");
  for(var i=0;i<30;i++){var s=document.createElement("i");s.style.left=(Math.random()*100)+"%";s.style.top=(Math.random()*52)+"%";s.style.animationDelay=(Math.random()*2.6)+"s";st.appendChild(s)}

  function period(){
    if(mode!=="real")return mode;
    var h=new Date().getHours();return h>=5&&h<12?"dia":h>=12&&h<19?"tarde":"noche"}
  function greet(p){return p==="dia"?"Buenos días,":p==="tarde"?"Buenas tardes,":"Buenas noches,"}
  function letters(el,text){el.textContent="";var out=[];
    text.split("").forEach(function(ch){var sp=document.createElement("span");
      if(ch===" "){sp.innerHTML="&nbsp;"}else{sp.textContent=ch}el.appendChild(sp);out.push(sp)});return out}
  function clearAll(){cancelAnimationFrame(raf);timers.forEach(clearTimeout);timers=[];extra.forEach(function(n){n.remove()});extra=[]}
  function later(fn,ms){timers.push(setTimeout(fn,ms))}

  function play(){
    clearAll();
    var p=period();stage.className=p;
    var W=stage.clientWidth,H=stage.clientHeight;
    var hw=Math.min(W*.44,170,H*.27),hh=hw*150/160,hx=(W-hw)/2,hy=H*.1;
    [hb,hf].forEach(function(s){s.style.left=hx+"px";s.style.top=hy+"px";s.style.width=hw+"px";s.style.height=hh+"px"});
    var R={x:W/2,y:hy+hh*84/150},bd=hw*.3,floorY=H*.455;
    ball.style.width=bd+"px";ball.style.height=bd+"px";
    [flash,rays].forEach(function(e){e.style.left=R.x+"px";e.style.top=R.y+"px";e.style.opacity=0});
    var hiL=letters(hi,greet(p)),nmL=letters(nm,"Arturo");
    ms.style.opacity=0;tp.style.opacity=0;

    if(reduce){ball.style.transform="translate("+(R.x-bd/2)+"px,"+(floorY-bd/2)+"px)";
      hiL.concat(nmL).forEach(function(e){e.style.opacity=1});ms.style.opacity=1;return}

    function showText(){
      hiL.forEach(function(el,i){el.animate([{opacity:0,transform:"translateY(20px) rotate(-6deg)"},{opacity:1,transform:"none"}],{duration:520,delay:i*30,easing:"cubic-bezier(.2,1.4,.4,1)",fill:"both"})});
      nmL.forEach(function(el,i){el.animate([{opacity:0,transform:"translateY(-46px) scale(1.7)"},{opacity:1,transform:"translateY(4px) scale(.94)",offset:.6},{opacity:1,transform:"none"}],{duration:720,delay:260+i*85,easing:"cubic-bezier(.3,.9,.3,1)",fill:"both"})});
      ms.animate([{opacity:0,transform:"translateY(14px)"},{opacity:1,transform:"none"}],{duration:600,delay:1000,easing:"ease-out",fill:"both"});
      tp.animate([{opacity:0},{opacity:.8}],{duration:600,delay:1900,fill:"both"})}

    function swish(){
      net.animate([{transform:"scale(1,1)"},{transform:"scale(.88,1.34)",offset:.25},{transform:"scale(1.07,.9)",offset:.5},{transform:"scale(.97,1.07)",offset:.75},{transform:"none"}],{duration:900,easing:"ease-out"});
      flash.animate([{opacity:.95,transform:"scale(.3)"},{opacity:0,transform:"scale(1.25)"}],{duration:620,easing:"ease-out"});
      rays.animate([{opacity:.9,transform:"rotate(0) scale(.4)"},{opacity:0,transform:"rotate(40deg) scale(1.15)"}],{duration:900,easing:"ease-out"});
      stage.animate([{transform:"translate(0,0)"},{transform:"translate(-3px,2px)"},{transform:"translate(3px,-2px)"},{transform:"translate(-2px,0)"},{transform:"none"}],{duration:260});
      var cols=["#ff8a3d","#ffd166","#ffffff","#7dd3fc","#fca5a5","#a7f3d0"];
      for(var i=0;i<30;i++){var d=document.createElement("i");d.className="sp-bit";var sz=5+Math.random()*7,a=Math.PI*2*i/30+Math.random()*.4,dist=60+Math.random()*110;
        d.style.cssText="left:"+(R.x-sz/2)+"px;top:"+(R.y-sz/2)+"px;width:"+sz+"px;height:"+sz+"px;background:"+cols[i%cols.length]+";border-radius:"+(i%3?"50%":"2px");
        stage.appendChild(d);extra.push(d);
        d.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*dist+"px,"+(Math.sin(a)*dist-34)+"px) scale(1)",opacity:1,offset:.55},{transform:"translate("+Math.cos(a)*dist*1.1+"px,"+(Math.sin(a)*dist+70)+"px) scale(.2) rotate(260deg)",opacity:0}],{duration:900+Math.random()*350,easing:"cubic-bezier(.2,.7,.3,1)"}).onfinish=(function(n){return function(){n.remove()}})(d)}
      later(showText,260)}

    function floorRing(x,strength){
      var r=document.createElement("div");r.className="sp-ring";var w=bd*1.2;
      r.style.cssText="left:"+(x-w/2)+"px;top:"+(floorY+bd*.5-5)+"px;width:"+w+"px;height:10px";
      stage.appendChild(r);extra.push(r);
      r.animate([{opacity:.75*strength,transform:"scaleX(.4)"},{opacity:0,transform:"scaleX(2.6)"}],{duration:650,easing:"ease-out"}).onfinish=function(){r.remove()}}

    var S={x:-bd*1.3,y:H*.93},T1=1050,peak=H*.3,
        vEnd=((R.y-S.y)+4*peak)/T1,
        t0=performance.now(),phase=1,y=0,x=0,vy=vEnd,rot=-260,w=0,sq=0,last=t0,tIdle=0;
    function frame(now){
      var dt=Math.min(40,now-last);last=now;var sx=1,sy=1,sc=1;
      if(phase===1){
        var t=Math.min(1,(now-t0)/T1);
        x=S.x+(R.x-S.x)*t;y=S.y+(R.y-S.y)*t-peak*4*t*(1-t);
        sc=1.55-.55*(1-Math.pow(1-t,2));rot=-260+880*t;
        if(t>=1){phase=2;w=.2;x=R.x;vy=vEnd;swish()}
      }else if(phase===2){
        vy+=.0022*dt;y+=vy*dt;rot+=w*dt;w*=Math.pow(.985,dt/16);x=R.x;
        if(y>=floorY&&vy>0){y=floorY;var imp=vy;sq=Math.min(1,imp*2);floorRing(x,Math.min(1,imp*2.2));vy=-imp*.5;if(imp<.1){phase=3;vy=0;tIdle=0}}
      }else{
        tIdle+=dt;y=floorY-Math.abs(Math.sin(tIdle*.0036))*5;rot+=.02*dt;x=R.x}
      sq*=Math.pow(.9,dt/16);sx=1+.2*sq;sy=1-.2*sq;
      ball.style.transform="translate("+(x-bd/2)+"px,"+(y-bd/2)+"px) rotate("+rot+"deg) scale("+(sc*sx)+","+(sc*sy)+")";
      raf=requestAnimationFrame(frame)}
    ball.style.transform="translate("+(S.x-bd/2)+"px,"+(S.y-bd/2)+"px) scale(1.55)";
    raf=requestAnimationFrame(frame);
  }

  var done=false;
  function bye(){if(done)return;done=true;clearAll();stage.classList.add("out");setTimeout(function(){stage.remove()},700)}
  stage.addEventListener("click",bye);
  play();
  setTimeout(bye,reduce?1800:3600);
})();
</script>

<script>
const C=[["m1","Tiro de 1 punto"],["m2","Tiro de 2 puntos"],["m3","Tiro de 3 puntos"],["def","Defensa"],["reb","Rebotes"],["ast","Asistencias"],["fal","Faltas"],["to","Se le fue alv"],["mal","Mal ahí"]];
const COL={def:"#22c55e",reb:"#14b8a6",ast:"#84cc16",to:"#f5b700",mal:"#f97316",fal:"#ef4444"};
const KEY="bball_v2";
let db={roster:[],games:[],cur:{rival:"",date:"",rows:{}}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s)db=s}catch(e){}
let tab="game",open=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
const zero=()=>Object.assign(Object.fromEntries(C.map(c=>[c[0],0])),{tf:0});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function ask(msg,yes,lb){const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:99";o.innerHTML=`<div style="background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;max-width:360px;width:100%"><p style="margin:0 0 14px;font-size:17px">${msg}</p><div class="row" style="margin:0"><button class="ghost" id="no">${(lb&&lb.no)||"Cancelar"}</button><button class="primary" id="si" style="flex:1">${(lb&&lb.si)||"Aceptar"}</button></div></div>`;document.body.appendChild(o);o.querySelector("#no").onclick=()=>o.remove();o.querySelector("#si").onclick=()=>{o.remove();yes()}}
const note=m=>ask(m,()=>{});
if(!db.cur.date)db.cur.date=today();
const row=id=>{const r=db.cur.rows[id]||(db.cur.rows[id]=zero());if(r.fal==null)r.fal=0;if(r.tf==null)r.tf=0;if(r.mal==null)r.mal=0;return r};
function d(s){return{pts:s.m1+2*s.m2+3*s.m3,m1:s.m1,m2:s.m2,m3:s.m3,def:s.def,reb:s.reb,ast:s.ast,fal:s.fal||0,to:s.to||0,mal:s.mal||0,tf:s.tf||0}}
const add=(a,b)=>{const r={};C.forEach(c=>r[c[0]]=(a[c[0]]||0)+(b[c[0]]||0));r.tf=(a.tf||0)+(b.tf||0);return r};

function table(list,avg,total){
  const H=["Jugador"].concat(avg?["PJ"]:[],["PTS","1 PT","2 PT","3 PT","DEF","REB","AST","FALTAS","SE LE FUE ALV","MAL AHÍ","T. FALLADOS"]);
  const tr=(p,cls)=>{const x=d(p.t),g=avg?p.g:1,f=v=>avg?(v/g).toFixed(1):v;
   return `<tr class="${cls||""}"><td>${esc(p.name)}</td>${avg?`<td>${p.g}</td>`:""}`+
   [x.pts,x.m1,x.m2,x.m3,x.def,x.reb,x.ast,x.fal,x.to,x.mal,x.tf].map(v=>`<td>${f(v)}</td>`).join("")+`</tr>`};
  let b=list.map(p=>tr(p)).join("");
  if(total&&list.length>1)b+=tr({name:"Equipo",t:list.reduce((a,p)=>add(a,p.t),zero())},"tot");
  return `<div class="wrap"><table><thead><tr>${H.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${b}</tbody></table></div>`}

const curPts=()=>{let n=0;for(const k in (db.cur.rows||{})){const r=db.cur.rows[k];if(r&&typeof r==="object")n+=(r.m1||0)+2*(r.m2||0)+3*(r.m3||0)}return n};
const sbo=w=>window.sbOpen&&window.sbOpen[w]?" split still":"",sbq=w=>window.sbOpen&&window.sbOpen[w]&&window.sbCells?`<div class="sbq">${window.sbCells(w)}</div>`:"";
function sbHtml(){const c=db.cur,rp=Number(c.rp)||0;
  return `<div class="sbx" id="sbx"><div class="sbt me${sbo("me")}"><small id="sbmn">${esc(c.tn||"Mi equipo")}</small><b id="sbms">${curPts()}</b><span class="sbl">Nosotros</span>${sbq("me")}</div><div class="sbt rv${sbo("rv")}${window.sbPick?" pick":""}"><small id="sbrn">${esc((c.rival||"").trim()||"Rival")}</small><b id="sbrs">${rp}</b><div class="sbpk" aria-label="Puntos del rival"><button data-act="rvp" data-id="1" style="--i:0">+1</button><button data-act="rvp" data-id="2" style="--i:1">+2</button><button data-act="rvp" data-id="3" style="--i:2">+3</button></div><button class="sbmn" data-act="rvp" data-id="-1" aria-label="Quitar 1 punto al rival">−1</button>${sbq("rv")}</div></div>`}
function vGame(){
  let h=`<div class="row"><input id="rival" placeholder="Rival (opcional)" value="${esc(db.cur.rival)}"><input id="date" type="date" value="${db.cur.date}"></div>
  <div class="row"><button class="ghost sv tmb" data-act="lteam" aria-haspopup="dialog">${IC_TEAM}Agregar equipo</button><button class="primary" data-act="addp" style="flex:1;padding:14px 10px">Agregar jugador</button></div>`+sbHtml();
  if(!db.roster.length)return h+`<div class="empty">Agrega a tus jugadores. Se quedan guardados para todos los partidos.</div>`;
  const qi=qInfo(),qc=C0(),vis=db.roster.filter(p=>!qc.inv[p.id]);

function confettiAt(cx,cy,n){

  const ring=document.createElement("div");ring.style.cssText=`position:fixed;left:${cx-34}px;top:${cy-34}px;width:68px;height:68px;border-radius:50%;border:4px solid #f5b700;opacity:0;pointer-events:none`;box.appendChild(ring);
  ring.animate([{transform:"scale(.6)",opacity:.9},{transform:"scale(4.2)",opacity:0}],{duration:750,easing:"ease-out",fill:"forwards"}).onfinish=()=>ring.remove();
  const cols=["#e8590c","#f5b700","#6fb1ea","#22c55e","#ff8a4c","#ffffff"];
  for(let i=0;i<n;i++){const a=Math.PI*2*i/n+Math.random()*.4,dist=70+Math.random()*90,sz=6+Math.random()*7,p=document.createElement("i");
    p.style.cssText=`position:fixed;left:${cx-sz/2}px;top:${cy-sz/2}px;width:${sz}px;height:${sz}px;border-radius:${i%3?"50%":"2px"};background:${cols[i%cols.length]};opacity:0;pointer-events:none`;box.appendChild(p);
    p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*dist}px,${Math.sin(a)*dist-30}px) scale(1)`,opacity:1,offset:.55},{transform:`translate(${Math.cos(a)*dist*1.1}px,${Math.sin(a)*dist+40}px) scale(.3) rotate(240deg)`,opacity:0}],{duration:800+Math.random()*300,easing:"cubic-bezier(.2,.7,.3,1)",fill:"forwards"})}
  setTimeout(()=>box.remove(),1400)}
function loadFx(fx){
  const n=fx.ids.length;
  toast("nuevo",`¡Equipo ${esc(fx.name)} cargado!`,`${n} jugador${n===1?"":"es"} en la cancha`+(fx.away.length?` · ${fx.away.length} al inventario`:""));
  if(RMO())return;
  const STEP=110,FLY=640,src=fx.from,sx=src.left+src.width/2,sy=src.top+src.height/2;
  const tile=id=>document.querySelector(`#strip .tile[data-id="${id}"]`);
  fx.fresh.forEach((id,i)=>{const t=tile(id);if(!t)return;
    const r=t.getBoundingClientRect(),dx=sx-(r.left+r.width/2),dy=sy-(r.top+r.height/2),f=t.cloneNode(true);
    t.style.visibility="hidden";f.classList.add("drag");f.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;z-index:140`;document.body.appendChild(f);
    f.animate([{transform:`translate(${dx}px,${dy}px) scale(.3) rotate(-50deg)`,opacity:0,offset:0},
      {transform:`translate(${dx*.5}px,${dy*.5-70}px) scale(1.15) rotate(14deg)`,opacity:1,offset:.5},
      {transform:"translate(0,0) scale(1.28,.76)",offset:.78},
      {transform:"translate(0,-12px) scale(.96,1.06)",offset:.9},
      {transform:"none",offset:1}],{duration:FLY,delay:i*STEP,easing:"cubic-bezier(.3,.1,.3,1)",fill:"both"}).onfinish=()=>{
        f.remove();t.style.visibility="";burst(t);
        t.animate([{transform:"scale(1)"},{transform:"scale(1.18)",offset:.4},{transform:"none"}],{duration:300,easing:"ease-out"})}});
  const last=fx.fresh.length?FLY+(fx.fresh.length-1)*STEP:0;
  fx.ids.filter(id=>!fx.fresh.includes(id)).forEach((id,j)=>{const t=tile(id);if(!t)return;
    t.animate([{transform:"none",boxShadow:"0 0 0 0 var(--acc)"},{transform:"translateY(-10px) scale(1.14)",boxShadow:"0 0 0 8px transparent",offset:.4},{transform:"none"}],{duration:480,delay:last+j*70,easing:"ease-out"})});
  const done=last+Math.max(0,fx.ids.length-fx.fresh.length)*70+120;
  setTimeout(()=>{const st=document.getElementById("strip");if(st){const r=st.getBoundingClientRect();confettiAt(r.left+r.width/2,r.top+Math.min(r.height,80)/2,24)}},Math.max(300,done));
  if(fx.away.length)setTimeout(()=>{const iv=document.getElementById("inv");if(iv)iv.querySelectorAll(".slot[data-id]").forEach((sl,k)=>{if(fx.away.includes(sl.dataset.id))setTimeout(()=>burst(sl),k*80)})},300)}

  document.getElementById("app").innerHTML=tab==="game"?vGame():tab==="avg"?vAvg():tab==="board"?vBoard():tab==="notes"?vNotes():tab==="teams"?vTeams():tab==="log"?vLog():vHist();if(tab==="board")bInit();if(tab==="game"){initStrip();initInv()}updScore();updLeft()}

function act(a,s){
  if(a.startsWith("tm"))return tmAct(a,s);
  if(a==="posopen"){const bar=document.querySelector("#pc"+s.id+" .posbar");if(!bar)return;const was=bar.classList.contains("show");
    document.querySelectorAll(".posbar.show").forEach(x=>x.classList.remove("show"));
    if(!was){const hd=bar.parentElement.querySelector(".head");bar.style.top=(hd.offsetTop+hd.offsetHeight+4)+"px";bar.classList.add("show")}return}
  if(a==="pos"){const p=db.roster.find(x=>x.id===s.id);if(!p)return;p.pos=Number(s.p)||0;save();render();
    const c=document.querySelector("#pc"+p.id+" .posb");
    if(c&&p.pos)c.animate([{transform:"rotateX(90deg) scale(.5)",opacity:0},{transform:"rotateX(0) scale(1.3)",opacity:1,offset:.6},{transform:"none"}],{duration:520,easing:"ease-out"});return}
  if(a==="nsave"){const ta=document.getElementById("nt"),v=(ta?ta.value:db.nd).trim();
    if(!v){if(ta){ta.classList.add("err");ta.focus()}return}
    if(db.ne){const n=db.notes.find(x=>x.id===db.ne);if(n){n.text=v;n.u=Date.now()}}else db.notes.unshift({id:"n"+Date.now(),t:Date.now(),text:v});
    db.nd="";db.ne=null;save();render();toast("info","Nota guardada","Ya puedes enviarla por WhatsApp");return}
  if(a==="ncancel"){db.ne=null;db.nd="";save();render();return}
  if(a==="nedit"){const n=db.notes.find(x=>x.id===s.id);if(!n)return;db.ne=n.id;db.nd=n.text;save();render();window.scrollTo({top:0,behavior:"smooth"});const ta=document.getElementById("nt");if(ta)ta.focus({preventScroll:true});return}
  if(a==="nplay"){const bt2=document.querySelector('[data-act="nplay"][data-id="'+s.id+'"]');
    window.AUD.get(s.id).then(bl=>{if(!bl){toast("info","Audio no disponible","No se encontró el audio de esta nota");return}
      document.querySelectorAll("audio.nau").forEach(x=>{x.pause();x.remove()});
      const au=document.createElement("audio");au.className="nau";au.controls=true;au.autoplay=true;au.src=URL.createObjectURL(bl);au.style.cssText="width:100%;margin:8px 0 0";
      const nb=bt2&&bt2.closest(".note,.lastau");if(nb)nb.appendChild(au);au.play&&au.play().catch(()=>{})}).catch(()=>toast("info","Audio no disponible","No se pudo abrir el audio"));return}
  if(a==="ndel"){ask("¿Borrar esta nota?",()=>{try{window.AUD.del(s.id)}catch(x){}db.notes=db.notes.filter(n=>n.id!==s.id);if(db.ne===s.id){db.ne=null;db.nd=""}save();render()});return}
  if(a==="ncopy"){const n=db.notes.find(x=>x.id===s.id);if(n){copyTxt(noteTxt(n));toast("info","Nota copiada","Pégala donde quieras")}return}
  if(a==="nfile"){if(s.id==="all"){if(db.notes.length)saveTxt("notas-equipo-"+dayStamp(Date.now())+".txt",fileAll())}
    else{const n=db.notes.find(x=>x.id===s.id);if(n){const d=new Date(n.t);saveTxt("nota-"+dayStamp(n.t)+"-"+p2(d.getHours())+p2(d.getMinutes())+".txt",fileTxt(n))}}return}
  if(a==="nwa"){if(s.id==="all"){if(db.notes.length)sendWA(allTxt())}else{const n=db.notes.find(x=>x.id===s.id);if(n)sendWA(noteTxt(n))}return}
  if(a==="addp"){askNum({title:"Nuevo jugador",okText:"Agregar",withName:true,onOk:(num,n)=>{
      const id="p"+Date.now();db.roster.push({id,name:n||"",num});save();stripPop=id;render();stripPop=null;
      newPlayerFx(id,n||"",num)}})}
  else if(a==="lteam"){teamSheet(document.querySelector('[data-act="lteam"]'))}
  else if(a==="rvp"){const c=db.cur;c.rp=Math.max(0,Math.min(300,(Number(c.rp)||0)+Number(s.id)));save();window.sbPick=false;{const bx=document.querySelector(".sbt.rv");if(bx)bx.classList.remove("pick")}const q=document.getElementById("sbrs");if(q){q.textContent=c.rp;q.classList.remove("bump");void q.offsetWidth;q.classList.add("bump")}}
  else if(a==="tgl"){setOpen(openP===s.id?null:s.id)}
  else if(a==="editnum"){const p=db.roster.find(x=>x.id===s.id);if(!p)return;
    askNum({title:`Número de ${p.name?esc(p.name):"este jugador"}`,okText:"Guardar",num:p.num,editId:p.id,onOk:num=>{p.num=num;save();render()}})}
  else if(a==="n"){const r=row(s.id),fb=qInfo().fouls,b0=r[s.k]||0;r[s.k]=Math.max(0,b0+Number(s.d));
    if(s.k==="fal"){const df=(r.fal||0)-b0,cf=C0();
      if(df>0){if(!cf.bn[s.id]&&!cf.inv[s.id])cf.cnt[s.id]=(cf.cnt[s.id]||0)+df}
      else if(df<0){cf.cnt[s.id]=Math.min(cf.cnt[s.id]||0,Math.max(0,(r.fal||0)-(cf.fb[s.id]||0)))}
      if(df>0){const pf=db.roster.find(x=>x.id===s.id)||{};cf.log.push({id:"c"+Date.now()+Math.random().toString(36).slice(2,6),type:"fal",pid:s.id,name:pf.name||"",num:pf.num,q:qInfo().q,t:Date.now()})}
      else if(df<0){const i=cf.log.map(e=>e.type==="fal"&&e.pid===s.id).lastIndexOf(true);if(i>=0)cf.log.splice(i,1)}}
    if(/^m[123]$/.test(s.k)){const dd=(r[s.k]||0)-b0,c=C0(),pt=Number(s.k[1]);
      if(dd>0){const p=db.roster.find(x=>x.id===s.id)||{};c.log.push({id:"c"+Date.now()+Math.random().toString(36).slice(2,6),pid:s.id,name:p.name||"",num:p.num,pts:pt,q:qInfo().q,t:Date.now()})}
      else if(dd<0){const i=c.log.map(e=>e.pid===s.id&&e.pts===pt).lastIndexOf(true);if(i>=0)c.log.splice(i,1)}}
    save();render();goUp();if(s.k==="fal"){const f1=qInfo().fouls;if(fb<4&&f1>=4)bonusToast(f1)}}
  else if(a==="stash"){const go=()=>{const t=document.querySelector(`#strip .tile[data-id="${s.id}"]`);if(!t)return;
      const r=t.getBoundingClientRect(),c=t.cloneNode(true);c.classList.add("drag");c.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;document.body.appendChild(c);stash(s.id,c,t)};
    const iv=document.getElementById("inv"),q=iv&&iv.getBoundingClientRect();
    if(q&&(q.top<0||q.bottom>innerHeight)){window.scrollTo({top:Math.max(0,q.top+scrollY-90),behavior:"smooth"});setTimeout(go,550)}else go()}
  else if(a==="bench"){const c=C0(),f0=qInfo().fouls;if(c.bn[s.id])delete c.bn[s.id];else c.bn[s.id]=1;
    benchPop=s.id;save();render();benchPop=null;goUp();const f1=qInfo().fouls;if(f0<4&&f1>=4)bonusToast(f1)}
  else if(a==="delp"){const p=db.roster.find(x=>x.id===s.id);ask("¿Quitar a "+esc(plabel(p))+"? Sus partidos guardados no se borran.",()=>{db.roster=db.roster.filter(x=>x.id!==s.id);delete db.cur.rows[s.id];delete C0().bn[s.id];delete db.cur.fb[s.id];delete db.cur.inv[s.id];delete C0().cnt[s.id];C0().log=C0().log.filter(e=>e.pid!==s.id);save();render()})}
  else if(a==="end"){
    const rows=db.roster.map(p=>({id:p.id,name:p.name,num:p.num,s:row(p.id)})).filter(r=>Object.values(r.s).some(v=>v>0));
    if(!rows.length){note("Todavía no hay estadísticas que guardar.");return}
    ask("¿Terminar el partido y guardarlo?",()=>{const rp=db.cur.rp==null?null:Math.max(0,Number(db.cur.rp)||0),qz=qInfo(),g={id:Date.now(),date:db.cur.date||today(),rival:db.cur.rival.trim(),rows};if(db.cur.qp.length){g.qp=db.cur.qp.slice();if(!qz.done)g.qp.push(qz.live)}if(db.cur.log.length)g.log=db.cur.log.slice();if(db.cur.rq&&db.cur.rq.length){g.rq=db.cur.rq.slice();if(g.qp&&g.rq.length<g.qp.length&&rp!=null)g.rq.push(Math.max(0,rp-g.rq.reduce((x,y)=>x+y,0)))}if(rp!=null)g.rp=rp;
    if(db.cur.tn)g.tn=db.cur.tn;db.games.push(g);db.cur={rival:"",date:today(),rows:{}};window.sbOpen={me:false,rv:false};C0();save();open=g.id;tab="teams";render()},{no:"Cancelar",si:"Guardar partido"})}
  else if(a==="endq"){const q0=qInfo();if(q0.done)return;
    ask(`¿Seguro que quieres terminar el cuarto ${q0.q}? Se guardan sus ${q0.live} puntos.`,()=>{const z=qInfo(),c=C0();if(z.done)return;
      db.roster.forEach(p=>{c.fb[p.id]=(db.cur.rows[p.id]&&db.cur.rows[p.id].fal)||0});c.qp.push(z.live);c.qf.push(z.fouls);c.rq.push(Math.max(0,(Number(db.cur.rp)||0)-c.rq.reduce((a,b)=>a+b,0)));c.cnt={};qpop=z.q-1;save();render();qpop=-1;
      if(z.q===2)toast("info","Segunda mitad","Ahora tienes 3 tiempos fuera.");
      else if(z.q===4)toast("info","Cuarto 4 terminado","Ya puedes terminar el partido y guardarlo.")},{no:"No",si:"Sí"})}
  else if(a==="delall"){ask("¿Borrar a TODOS los jugadores? Se borran también las estadísticas y los cuartos de este partido. Los partidos ya guardados no se borran.",()=>{db.roster=[];db.cur.rows={};db.cur.qp=[];db.cur.qf=[];db.cur.rq=[];db.cur.to={a:2,b:3};db.cur.bn={};db.cur.fb={};db.cur.inv={};db.cur.cnt={};db.cur.log=[];save();render()})}
  else if(a==="grp"){const g=db.games.find(x=>x.id===Number(s.id));if(!g)return;
    askRp({text:"Marcador del partido",value:g.rp,okText:"Guardar",onOk:rp=>{if(rp==null)delete g.rp;else g.rp=rp;save();render()}})}
  else if(a==="open"){open=Number(s.id);render()}
  else if(a==="back"){open=null;render()}
  else if(a==="delg"){ask("¿Borrar este partido? Los promedios se recalculan.",()=>{db.games=db.games.filter(x=>x.id!==Number(s.id));open=null;save();render()})}
  else if(a==="exp"){const u=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"})),l=document.createElement("a");l.href=u;l.download="respaldo-basquet.json";l.click()}
  else if(a==="imp"){document.getElementById("file").click()}
}

const bDist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const bClamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const bBall=s=>s.holder?{x:s.p[s.holder].x-30,y:s.p[s.holder].y+24}:{x:s.bx,y:s.by};
function bToSvg(e){const s=document.getElementById("bsvg"),p=new DOMPoint(e.clientX,e.clientY).matrixTransform(s.getScreenCTM().inverse());return{x:p.x,y:p.y}}
function bQuad(q){
  if(q.length<3)return`M${q[0].x} ${q[0].y}L${q[q.length-1].x} ${q[q.length-1].y}`;
  let s=`M${q[0].x} ${q[0].y}`;
  for(let i=1;i<q.length-1;i++)s+=`Q${q[i].x} ${q[i].y} ${(q[i].x+q[i+1].x)/2} ${(q[i].y+q[i+1].y)/2}`;
  return s+`L${q[q.length-1].x} ${q[q.length-1].y}`}
function bSmooth(q){let a=q;for(let n=0;n<2;n++){const b=a;a=b.map((p,i)=>i===0||i===b.length-1?p:{x:(b[i-1].x+p.x+b[i+1].x)/3,y:(b[i-1].y+p.y+b[i+1].y)/3})}return a}
function bWavy(q){ // línea ondulada: onda perpendicular al trazo, se aplana al inicio y al final
  const P=[0];let L=0;for(let i=1;i<q.length;i++){L+=bDist(q[i-1],q[i]);P.push(L)}
  if(L<36)return q;
  const N=Math.floor(L/4),out=[];let j=0;
  for(let k=0;k<=N;k++){
    const s=k*L/N;while(j<P.length-2&&P[j+1]<s)j++;
    const a=q[j],b=q[j+1],t=(s-P[j])/((P[j+1]-P[j])||1);
    const tx=b.x-a.x,ty=b.y-a.y,tl=Math.hypot(tx,ty)||1;
    const o=8*Math.min(1,s/26,(L-s)/34)*Math.sin(s/3.4);

function bLine(l){

  if(l.type==="dribble"){

    return`<path d="M${w.map(p=>p.x.toFixed(1)+" "+p.y.toFixed(1)).join("L")}" stroke="#161616" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#bah2)"/>`}

function bRender(v,bxy){

    h+=`<circle cx="${p.x}" cy="${p.y}" r="${BR}" fill="#fff" stroke="#2f6fde" stroke-width="4.5"/><text x="${p.x}" y="${p.y+10}" text-anchor="middle" font-family="Trebuchet MS,sans-serif" font-weight="700" font-size="28" fill="#2f6fde">${id}</text>`}
  h+=`<circle cx="${b.x}" cy="${b.y}" r="14" fill="#e8781f" stroke="#161616" stroke-width="2"/><path d="M${b.x-14} ${b.y}H${b.x+14}M${b.x} ${b.y-14}V${b.y+14}" stroke="#161616" stroke-width="1.5"/>`;

function bInit(){
  const svg=document.getElementById("bsvg");
  document.getElementById("btools").onclick=e=>{const t=e.target.closest("button");if(!t)return;bd.tool=t.dataset.t;document.querySelectorAll("#btools button").forEach(x=>x.classList.toggle("on",x===t))};

      for(const id of [5,4,3,2,1]){const p=s.p[id];if(bDist(pt,p)<BR+10){bdrag={k:"p",id,dx:p.x-pt.x,dy:p.y-pt.y};return}}
    }else{
      let st=pt;for(const id of [1,2,3,4,5]){if(bDist(pt,s.p[id])<BR+10){st={x:s.p[id].x,y:s.p[id].y};break}}

      const q=bdraw.pts;

    const s=bd.steps[bd.cur];
    if(bdrag&&bdrag.k==="ball"){for(const id of [1,2,3,4,5]){if(bDist({x:s.bx,y:s.by},s.p[id])<50){s.holder=id;break}}}
    if(bdraw){const q=bdraw.pts;if(q.length>1&&bDist(q[0],q[q.length-1])>24)s.lines.push(bdraw);bdraw=null}

  document.getElementById("app").onclick=e=>{
    const b=e.target.closest("button");if(!b||bplay)return;
    if(b.dataset.s!==undefined){bd.cur=+b.dataset.s;bRefresh();return}
    const a=b.dataset.b;if(!a)return;
    if(a==="logo"){bd.logo=!bd.logo;bSave();document.getElementById("bhawk").style.display=bd.logo?"":"none";b.classList.toggle("on",bd.logo);return}
    if(bPlayAct(a,b))return;
    if(a==="undo"){bd.steps[bd.cur].lines.pop()}
    else if(a==="clear"){bd.steps[bd.cur].lines=[]}
    else if(a==="reset"){bd.steps[bd.cur]=bNew()}
    else if(a==="add"){const n=JSON.parse(JSON.stringify(bd.steps[bd.cur]));n.lines=[];bd.steps.splice(bd.cur+1,0,n);bd.cur++}
    else if(a==="del"&&bd.steps.length>1){bd.steps.splice(bd.cur,1);bd.cur=Math.min(bd.cur,bd.steps.length-1)}
    else if(a==="play"){bPlay();return}
    bSave();bRefresh()};
  bRefresh();bList()}
function bLoadPlays(){try{return JSON.parse(localStorage.getItem("bball_plays")||"[]")}catch(e){return[]}}

let bSure=null;
let bNaming=false,bFlash=null;
function bList(){
  const el=document.getElementById("bplays");if(!el)return;
  const L=bLoadPlays();
  const form=bNaming?`<div class="bpl bname" id="bnameform"><div style="flex:1 1 100%"><b>Ponle nombre a la jugada</b></div><input id="bnm" maxlength="60" placeholder="Ej. Triángulo" value="${esc(bd.id?bd.title:"")}" aria-label="Nombre de la jugada"><button data-b="confirm" class="pri">Guardar</button>${bd.id?'<button data-b="confirmnew">Guardar como nueva</button>':''}<button data-b="cancel">Cancelar</button></div>`:"";

    rec.onresult=ev=>{let f="",i2="";for(let k=0;k<ev.results.length;k++){const r=ev.results[k];if(r.isFinal)f+=r[0].transcript+" ";else i2+=r[0].transcript}fin=f.trim();itm=i2.trim();upd()};
    rec.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){cancel=true;done=true;on=false;try{rec.abort()}catch(x){}killMs();clean();toast("info","Sin permiso de micrófono","Permite el micrófono para esta app en los ajustes del navegador");return}
      if(ev.error==="audio-capture"){cancel=true;done=true;killMs();clean();toast("info","No encuentro micrófono","Revisa que tu equipo tenga uno disponible")}};
    rec.onend=()=>{ended=true;if(on&&!done){try{rec.start();ended=false}catch(x){}return}if(done&&!bar&&!on)return;if(done)save1()};
    bar=document.createElement("div");bar.id="micbar";bar.setAttribute("role","status");bar.innerHTML='<i class="mdot"></i><b>0:00</b><button type="button">Cancelar</button><span>Escuchando… habla ahora</span>';
    bar.querySelector("button").onclick=ev=>{ev.stopPropagation();cancel=true;stop()};
    document.body.appendChild(bar);bt.classList.add("rec");
    try{navigator.vibrate&&navigator.vibrate(12)}catch(x){}
    tk=setInterval(()=>{upd();if(Date.now()-t0>120000)stop()},500);
    try{rec.start();ended=false}catch(x){killMs();clean();toast("info","No pude iniciar la grabación","Intenta de nuevo");return}
    try{if(window.MediaRecorder&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
      if(!on||done){st.getTracks().forEach(t=>t.stop());return}
      ms=st;const mt=["audio/webm;codecs=opus","audio/webm","audio/mp4"].find(m=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
      try{mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined)}catch(e){try{mr=new MediaRecorder(st)}catch(e2){mr=null;killMs();return}}
      mr.ondataavailable=ev=>{if(ev.data&&ev.data.size)ch.push(ev.data)};mr.start(1000)}).catch(()=>{})}}catch(x){}};
  const stop=()=>{if(!on||done)return;done=true;try{rec.stop()}catch(x){}
    setTimeout(()=>{if(bar||on){if(!ended){try{rec.abort()}catch(x){}}save1()}},ended?0:1500)};
  bt.addEventListener("click",e=>{e.stopPropagation();e.preventDefault();if(on)stop();else start(e)});
  bt.addEventListener("contextmenu",e=>e.preventDefault());
})();
if("serviceWorker" in navigator){const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!window.__rl){window.__rl=1;location.reload()}});
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{})}
